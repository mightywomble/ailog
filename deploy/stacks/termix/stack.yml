# termix - rendered from wizard.yaml by homelab-wizard.
# Owned by the wizard: image tag, published ports, replicas, volumes.
# Everything else here is hand-maintained and survives a re-render.
services:
  termix:
    image: zot.safehomelan.com/termix:26.11.0
    environment:
      PORT: '8080'
    ports:
    - '8080'
    volumes:
    - type: bind
      source: /opt/docker/data/termix
      target: /app/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pool == w3
      restart_policy:
        condition: any
  guacd:
    image: zot.safehomelan.com/guacd:1.6.0
    ports:
    - 4822:4822
    healthcheck:
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 4822 || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pool == w3
      restart_policy:
        condition: any
