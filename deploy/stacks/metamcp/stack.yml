# MetaMCP (MCP aggregator / gateway) on the swarm.
# Upstream: https://github.com/metatool-ai/metamcp — app on :12008, needs
# postgres. Images mirrored/built into zot:
#   metamcp:2.4.22      mirrored by "Mirror upstream images to zot"
#   metamcp:build-NN    apps/metamcp in homelab_docker_build — thin layer that
#                       adds the pihole-mcp Go binary (not on npm/PyPI) so every
#                       homelab MCP server can run as a stdio server
#   postgres16:16-alpine mirrored (16 = the major version MetaMCP expects)
#
# Swarm adaptations vs the upstream compose:
#  - postgres is internal only; the app is published on 8091 (next free port —
#    8090 freshrss, 8088 huntly, 8089, 8083, 8082, 8080 ... are taken)
#  - postgres data on the shared NFS at /opt/docker/data/metamcp/postgres
#    (uid 70 = postgres in the alpine image), so the task can reschedule
#  - /root/.npm and /root/.cache/uv also live on the NFS so the npx/uvx
#    downloads that back the stdio MCP servers survive a reschedule
#  - APP_URL/NEXT_PUBLIC_APP_URL are the public https origin (better-auth
#    cookies + redirects depend on it)
#
# Access:
#   https://mcp.safehomelan.com   (NPM proxy host -> 100.79.189.118:8091,
#                                  wildcard *.safehomelan.com cert, websockets)
#   The name resolves to 100.122.246.45 (casaos/NPM) via the Pi-hole local DNS
#   record; http://<node>:8091 also works on the tailnet.
#
# First run: BOOTSTRAP_USER_* creates the account below on first boot
# (only applied when the users table is still empty).
services:
  app:
    image: zot.safehomelan.com/metamcp:${IMAGE_TAG:-build-348}
    environment:
      NODE_ENV: "production"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "metamcp_user"
      POSTGRES_DB: "metamcp_db"
      # POSTGRES_PASSWORD, BETTER_AUTH_SECRET, BOOTSTRAP_USER_PASSWORD and the
      # DATABASE_URL that embeds the password are built from swarm secrets by
      # the command below, so none of them are in this file any more.
      APP_URL: "https://mcp.safehomelan.com"
      NEXT_PUBLIC_APP_URL: "https://mcp.safehomelan.com"
      # don't rewrite localhost: we point at tailnet addresses, not host.docker.internal
      TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL: "false"
      # bootstrap the admin account on first boot
      BOOTSTRAP_USER_EMAIL: "david@davidfield.co.uk"
      # BOOTSTRAP_USER_PASSWORD comes from /run/secrets/metamcp_bootstrap_password
      BOOTSTRAP_USER_NAME: "david"
      BOOTSTRAP_DISABLE_REGISTRATION_UI: "true"
      TZ: "Europe/London"
    # A Node app with its own docker-entrypoint.sh and no `_FILE` support, so the
    # secret is read by sh and exported before the entrypoint takes over. The
    # DATABASE_URL is rebuilt here rather than in the stack file: it embeds the
    # password, and leaving it there would put the value straight back.
    command:
      - sh
      - -c
      - |
        export POSTGRES_PASSWORD="$$(cat /run/secrets/metamcp_postgres_password)"
        export BETTER_AUTH_SECRET="$$(cat /run/secrets/metamcp_auth_secret)"
        export BOOTSTRAP_USER_PASSWORD="$$(cat /run/secrets/metamcp_bootstrap_password)"
        export DATABASE_URL="postgresql://metamcp_user:$${POSTGRES_PASSWORD}@postgres:5432/metamcp_db"
        exec ./docker-entrypoint.sh
    secrets:
      - metamcp_postgres_password
      - metamcp_auth_secret
      - metamcp_bootstrap_password
    volumes:
      - type: bind
        source: /opt/docker/data/metamcp/npm
        target: /root/.npm
      - type: bind
        source: /opt/docker/data/metamcp/uv
        target: /root/.cache/uv
    # The app talks to itself over its public origin (APP_URL), and the stdio
    # MCP servers talk to *.safehomelan.com. Without this, the container uses
    # the node's upstream resolvers - which include OpenDNS - and OpenDNS
    # NXDOMAIN-redirects names it cannot see in public DNS to 216.40.34.41,
    # so mcp.safehomelan.com timed out for 10s on every MetaMCP client call.
    # Pointing the container at Pi-hole makes *.safehomelan.com resolve to
    # 100.122.246.45 (NPM) like every other host on the estate; Docker's own
    # 127.0.0.11 still answers service names (postgres) first.
    dns:
      - 100.122.246.45
    ports:
      - "8091:12008"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:12008/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pool == w1
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        order: stop-first

  postgres:
    image: zot.safehomelan.com/postgres16:16-alpine
    secrets:
      - metamcp_postgres_password
    environment:
      POSTGRES_USER: "metamcp_user"
      POSTGRES_PASSWORD_FILE: "/run/secrets/metamcp_postgres_password"
      POSTGRES_DB: "metamcp_db"
      PGDATA: "/var/lib/postgresql/data/pgdata"
      TZ: "Europe/London"
    volumes:
      - type: bind
        source: /opt/docker/data/metamcp/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metamcp_user -d metamcp_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.pool == w1
      restart_policy:
        condition: any
      update_config:
        order: stop-first

secrets:
  metamcp_postgres_password:
    external: true
  metamcp_auth_secret:
    external: true
  metamcp_bootstrap_password:
    external: true
