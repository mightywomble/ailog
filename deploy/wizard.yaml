# wizard.yaml - the source of truth for this repo.
# stacks/<name>/stack.yml, the mirror-images.json entry and the nginx
# proxy host are rendered from here by homelab-wizard. Plain yaml: hand
# edits are fine and are what the wizard commits.
#
# kind: build  -> apps/<repo>/ is built by this repo (tag comes from the run)
#       mirror -> upstream image cached into zot by mirror.yml
#       image  -> plain upstream image, used as-is
version: 1
about: Intent file for the homelab swarm. stacks/<name>/stack.yml, the mirror-images.json entry and the
  nginx proxy host are rendered from this file by homelab-wizard. It is plain yaml - edit it by hand too.
defaults:
  registry: zot.safehomelan.com
  domain_suffix: safehomelan.com
  cert: npm-1
  data_root: /opt/docker/data
  port_bands:
    data:
    - 3000
    - 3499
    api:
    - 5000
    - 5099
    web:
    - 8000
    - 8199
    tailnet:
    - 8200
    - 8999
reserved_ports:
  '8089': retired metamcp_router (tombstone)
  '5001': ailog
services:
- name: ailog
  kind: build
  release: manual
  service: ailog
  image: zot.safehomelan.com/ailog:v3.29.5
  repo: ailog
  version: v3.29.5
  source: ''
  ports:
  - host: 5001
    container: 5001
    mode: ingress
  url: ailog.safehomelan.com
  replicas: 1
  volumes:
  - host: /opt/docker/data/ailog
    container: /var/lib/ailog
  env_count: 4
  companions:
  - ailog-mcp
- name: anchor
  kind: mirror
  service: anchor
  image: zot.safehomelan.com/anchor:0.9.1
  repo: anchor
  version: 0.18.0
