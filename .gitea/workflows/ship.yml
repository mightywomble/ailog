name: Release and deploy
# One repo, one chain. A PR merge into main lands as a push to main; this
# workflow builds every changed app, pushes it to zot, then deploys every
# changed stack - with the tag that was just built, in the same run.
#
# Everything estate-side is under deploy/ now (this workflow used to live in the
# homelab-ops repo): apps are deploy/apps/<name>, stacks deploy/stacks/<name>.
# The release job runs on the build server's runner (ubuntu-latest); the deploy
# job runs on the swarm manager (label deploy).
#
# Why the "bump the tag in the other repo" step is gone: stack files carry
#   image: zot.safehomelan.com/<app>:${IMAGE_TAG:-<pinned tag>}
# and the deploy job exports IMAGE_TAG, so `docker stack deploy` interpolates
# the tag from this run. Mirrored/upstream images keep literal tags and ignore
# the variable.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_stacks:
        description: 'Create stacks that do not exist on the swarm yet'
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      apps: ${{ steps.changed.outputs.apps }}
      stacks: ${{ steps.changed.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: What changed
        id: changed
        run: |
          set -e
          # a merge commit's first parent is the previous main tip, so this is
          # exactly "what the pull request changed"
          git log --oneline -3 || true
          echo "HEAD=$(git rev-parse HEAD) P1=$(git rev-parse HEAD^1 2>/dev/null || echo none)"
          if git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD^1 HEAD)
            echo "changed files:"; printf '%s\n' "$CHANGED"
            APPS=$(printf '%s\n' "$CHANGED" | grep '^deploy/apps/' | cut -d/ -f3 | sort -u | grep -v '^$' || true)
            STACKS=$(printf '%s\n' "$CHANGED" | grep '^deploy/stacks/' | cut -d/ -f3 | sort -u | grep -v '^$' || true)
          else
            APPS=$(ls deploy/apps 2>/dev/null || true)
            STACKS=$(ls deploy/stacks 2>/dev/null || true)
          fi
          # write the changed set to files: this runner resolves job outputs but
          # not step outputs inside the same job, so the build step reads these
          printf '%s\n' $APPS > .changed-apps
          printf '%s\n' $STACKS > .changed-stacks
          echo "apps: $(tr '\n' ' ' < .changed-apps)"
          echo "stacks: $(tr '\n' ' ' < .changed-stacks)"

      - name: Tag
        id: meta
        run: echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Log in to zot
        run: echo "${{ secrets.ZOT_PASSWORD }}" | docker login "${{ secrets.ZOT_URL }}" -u "${{ secrets.ZOT_USER }}" --password-stdin

      - name: Build, test and push changed apps
        # no if: guard - the runner skipped the step even with a non-empty
        # output, and an empty APPS loop is a no-op anyway
        env:
          ZOT_URL: ${{ secrets.ZOT_URL }}
          BUILD_TAG: ${{ steps.meta.outputs.tag }}
          APPS_FILE: .changed-apps
        run: |
          set -e
          REGISTRY="${ZOT_URL#https://}"; REGISTRY="${REGISTRY%/}"
          APPS=$(cat .changed-apps 2>/dev/null || true)
          echo "apps to build: ${APPS:-none}"
          cfg() { python3 -c "import json;print(json.load(open('deploy/apps/$1/build.json')).get('$2',''))"; }

          for APP in $APPS; do
            if [ -f "deploy/apps/$APP/build.json" ]; then
              SRC=$(cfg "$APP" source); REF=$(cfg "$APP" ref)
              DF=$(cfg "$APP" dockerfile); CTX=$(cfg "$APP" context); CTX=${CTX:-.}
              WORK="/tmp/homelab-build/$APP"
              rm -rf "$WORK"
              echo "=== cloning $SRC ($REF) for $APP ==="
              git clone --depth 1 --branch "$REF" "$SRC" "$WORK"
              [ -f "deploy/apps/$APP/patch.sh" ] && bash "deploy/apps/$APP/patch.sh" "$WORK"
              echo "=== building $APP as $REGISTRY/$APP:$BUILD_TAG ==="
              docker build -f "$WORK/$DF" -t "$REGISTRY/$APP:$BUILD_TAG" -t "$REGISTRY/$APP:latest" "$WORK/$CTX"
              rm -rf "$WORK"
            elif [ -f "deploy/apps/$APP/Dockerfile" ]; then
              echo "=== building deploy/apps/$APP as $REGISTRY/$APP:$BUILD_TAG ==="
              docker build -t "$REGISTRY/$APP:$BUILD_TAG" -t "$REGISTRY/$APP:latest" "deploy/apps/$APP"
            else
              echo "deploy/apps/$APP has no Dockerfile or build.json - skipping"
              continue
            fi
            if [ -f "deploy/apps/$APP/test.sh" ]; then
              echo "=== smoke testing $APP ==="
              bash "deploy/apps/$APP/test.sh" "$REGISTRY/$APP:$BUILD_TAG"
            fi
            docker push "$REGISTRY/$APP:$BUILD_TAG"
            docker push "$REGISTRY/$APP:latest"
            docker rmi "$REGISTRY/$APP:$BUILD_TAG" "$REGISTRY/$APP:latest" >/dev/null 2>&1 || true
            echo "released $REGISTRY/$APP:$BUILD_TAG"
          done
          docker image prune -f >/dev/null 2>&1 || true

  deploy:
    needs: release
    runs-on: deploy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the deploy job diffs the merge itself

      - name: Log in to zot
        run: echo "${{ secrets.ZOT_PASSWORD }}" | docker login "${{ secrets.ZOT_URL }}" -u "${{ secrets.ZOT_USER }}" --password-stdin

      - name: Deploy changed stacks
        env:
          ZOT_URL: ${{ secrets.ZOT_URL }}
          IMAGE_TAG: ${{ needs.release.outputs.tag }}
          # A tree that lists a stack does not mean the estate should grow one.
          # deploy/stacks/ keeps records for services that were never deployed
          # (or were removed); a push that brings the whole tree in - the merge
          # that first landed deploy/ - would otherwise create them. Existing
          # stacks are updated; new ones need an explicit dispatch.
          CREATE_STACKS: ${{ github.event.inputs.create_stacks || 'false' }}
        run: |
          set -e
          # multi-line job outputs are unreliable across Gitea runners, so the
          # changed set is recomputed here rather than passed from release
          git log --oneline -3 || true
          echo "HEAD=$(git rev-parse HEAD) P1=$(git rev-parse HEAD^1 2>/dev/null || echo none)"
          if git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD^1 HEAD)
            echo "changed files:"; printf '%s\n' "$CHANGED"
            APPS=$(printf '%s\n' "$CHANGED" | grep '^deploy/apps/' | cut -d/ -f3 | sort -u | grep -v '^$' || true)
            STACKS=$(printf '%s\n' "$CHANGED" | grep '^deploy/stacks/' | cut -d/ -f3 | sort -u | grep -v '^$' || true)
          else
            APPS=$(ls deploy/apps 2>/dev/null || true)
            STACKS=$(ls deploy/stacks 2>/dev/null || true)
          fi
          # Always add the stacks that reference a rebuilt app - not only when no
          # stack file changed. A merge that touched both deploy/apps/x and deploy/stacks/y used
          # to deploy y alone, so x's new image was built, pushed and never run.
          for APP in $APPS; do
            for f in deploy/stacks/*/stack.yml; do
              grep -q "/$APP:" "$f" && dirname "$f" | cut -d/ -f3
            done
          done | sort -u > /tmp/stacks-from-apps || true
          FROM_APPS=$(tr '\n' ' ' < /tmp/stacks-from-apps)
          echo "stacks that reference rebuilt apps: $FROM_APPS"
          STACKS=$(printf '%s\n%s\n' "$STACKS" "$FROM_APPS" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')
          echo "rebuilt apps this run: ${APPS:-none}"
          echo "deploying: $STACKS"
          REGISTRY="${ZOT_URL#https://}"; REGISTRY="${REGISTRY%/}"

          # IMAGE_TAG only means something for images THIS run pushed. A run that
          # only touched deploy/stacks/ (or a stack whose app did not rebuild) must use
          # the pinned ${IMAGE_TAG:-<tag>} default, otherwise swarm tries to pull
          # build-<n> that was never pushed and the service is rejected.
          stack_tag() {   # echoes the tag to use for $1, empty = keep pinned
            for A in $APPS; do
              grep -q "/$A:" "deploy/stacks/$1/stack.yml" || continue
              if docker manifest inspect "$REGISTRY/$A:$IMAGE_TAG" >/dev/null 2>&1; then
                echo "$IMAGE_TAG"; return 0
              fi
              echo "!!! $1 references $A but $REGISTRY/$A:$IMAGE_TAG is not in the registry" >&2
            done
          }

          missing_images() {   # echoes zot images in $1 that are not in the registry
            grep -oE 'zot\.safehomelan\.com/[A-Za-z0-9._/-]+:[A-Za-z0-9._-]+' "deploy/stacks/$1/stack.yml" \
              | sed 's/\${IMAGE_TAG:-[^}]*}/'"${IMAGE_TAG:-latest}"'/' | sort -u \
              | while read -r IMG; do
                  docker manifest inspect "$IMG" >/dev/null 2>&1 || echo "$IMG"
                done
          }

          FAILED=""
          SKIPPED=""
          LIVE_STACKS=$(docker stack ls --format '{{.Name}}' 2>/dev/null || true)
          for APP in $STACKS; do
            [ -f "deploy/stacks/$APP/stack.yml" ] || continue
            # Refuse to create a stack by accident - see CREATE_STACKS above.
            if [ "$CREATE_STACKS" != "true" ] && ! printf '%s\n' "$LIVE_STACKS" | grep -qx "$APP"; then
              echo "--- $APP exists in deploy/stacks but not on the swarm - not creating it"
              echo "    (dispatch this workflow with create_stacks=true to create it)"
              SKIPPED="$SKIPPED $APP"; continue
            fi
            # A tag that is not in zot takes the service down: swarm accepts the
            # deploy, then every task is rejected with "not found". Check first.
            MISSING=$(missing_images "$APP")
            if [ -n "$MISSING" ]; then
              echo "!!! $APP not deployed - image(s) missing from zot:"; echo "$MISSING"
              FAILED="$FAILED $APP"; continue
            fi
            TAG=$(stack_tag "$APP")
            if [ -n "$TAG" ]; then
              echo "=== deploying $APP with IMAGE_TAG=$TAG ==="
            else
              echo "=== deploying $APP with its pinned image tags ==="
            fi
            # one broken stack must not stop the rest of the estate deploying
            if ! ( if [ -n "$TAG" ]; then IMAGE_TAG="$TAG"; else unset IMAGE_TAG; fi
                   docker stack deploy -c "deploy/stacks/$APP/stack.yml" "$APP" --with-registry-auth ); then
              echo "!!! $APP failed to deploy"; FAILED="$FAILED $APP"
            fi
          done
          for APP in $STACKS; do
            [ -f "deploy/stacks/$APP/stack.yml" ] || continue
            echo "--- $APP"; docker stack ps "$APP" --no-trunc | head -8
          done
          [ -n "$SKIPPED" ] && echo "not deployed (absent from the swarm):$SKIPPED" || true
          if [ -n "$FAILED" ]; then
            echo "::error::stacks that failed to deploy:$FAILED"
            exit 1
          fi
