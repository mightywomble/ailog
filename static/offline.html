<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Homelab Manager — offline</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        html, body { height: 100%; }
        body {
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text);
            background: var(--bg);
            text-align: center;
        }
        .card {
            max-width: 420px;
            padding: 28px 24px;
            border-radius: var(--radius);
            background: var(--surface);
            border: 1px solid var(--border);
        }
        .mark {
            width: 52px; height: 52px; margin: 0 auto 16px;
            display: grid; place-items: center;
            border-radius: 14px;
            background: rgba(109, 40, 217, .18);
            color: #a78bfa;
        }
        h1 { margin: 0 0 8px; font-size: 1.15rem; }
        p { margin: 0 0 18px; font-size: .85rem; color: var(--muted); line-height: 1.5; }
        button {
            min-height: 44px;
            padding: 0 18px;
            border-radius: 10px;
            border: 1px solid rgba(34, 197, 94, .55);
            background: rgba(34, 197, 94, .16);
            color: #22c55e;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="mark" aria-hidden="true">
            <svg width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <rect x="3.5" y="4.5" width="17" height="6" rx="1.5"/>
                <rect x="3.5" y="13.5" width="17" height="6" rx="1.5"/>
                <path stroke-linecap="round" d="M7 7.5h.01M7 16.5h.01"/>
            </svg>
        </div>
        <h1>Homelab Manager is offline</h1>
        <p>The app shell did not load and the network is unreachable. The hosts themselves are only reachable from
           the network anyway — reconnect and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
