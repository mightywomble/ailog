# WordPress + MySQL on the swarm, both images mirrored into zot by repo1's
# "Mirror upstream images to zot" workflow (wordpress:7.1.3 = upstream latest
# at mirror time, mysql pinned at 8.0).
# Data lives on the shared NFS under /opt/docker/data/wordpress/ (html + db)
# so either service can reschedule to any node.
# Published on port 8082 via the routing mesh: http://<any-node-ip>:8082
# Standard wordpress docker-compose setup, e.g.:
# https://www.digitalocean.com/community/tutorials/how-to-install-wordpress-with-docker-compose
services:
  wordpress:
    image: zot.safehomelan.com/wordpress:7.1.3
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: <redacted>
      WORDPRESS_DB_NAME: wordpressdb
    ports:
      - "8082:80"
    volumes:
      - type: bind
        source: /opt/docker/data/wordpress/html
        target: /var/www/html
      # PHP upload/import limits (overrides the image's 2M/8M defaults):
      # edit /opt/docker/data/wordpress/uploads.ini on the NFS share
      - type: bind
        source: /opt/docker/data/wordpress/uploads.ini
        target: /usr/local/etc/php/conf.d/zz-uploads.ini
    deploy:
      replicas: 1
      restart_policy:
        condition: any
  mysql:
    image: zot.safehomelan.com/mysql:8.0
    environment:
      MYSQL_DATABASE: wordpressdb
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: <redacted>
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - type: bind
        source: /opt/docker/data/wordpress/db
        target: /var/lib/mysql
    deploy:
      replicas: 1
      restart_policy:
        condition: any
