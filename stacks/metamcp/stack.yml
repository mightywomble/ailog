# MetaMCP (MCP aggregator / gateway) on the swarm.
# Upstream: https://github.com/metatool-ai/metamcp — app on :12008, needs
# postgres. Images mirrored/built into zot:
#   metamcp:2.4.22      mirrored by "Mirror upstream images to zot"
#   metamcp:build-NN    apps/metamcp in homelab_docker_build — thin layer that
#                       adds the pihole-mcp Go binary (not on npm/PyPI) so every
#                       homelab MCP server can run as a stdio server
#   postgres16:16-alpine mirrored (16 = the major version MetaMCP expects)
#
# Swarm adaptations vs the upstream compose:
#  - postgres is internal only; the app is published on 8091 (next free port —
#    8090 freshrss, 8088 huntly, 8089, 8083, 8082, 8080 ... are taken)
#  - postgres data on the shared NFS at /opt/docker/data/metamcp/postgres
#    (uid 70 = postgres in the alpine image), so the task can reschedule
#  - /root/.npm and /root/.cache/uv also live on the NFS so the npx/uvx
#    downloads that back the stdio MCP servers survive a reschedule
#  - APP_URL/NEXT_PUBLIC_APP_URL are the public https origin (better-auth
#    cookies + redirects depend on it)
#
# Access:
#   https://mcp.safehomelan.com   (NPM proxy host -> 100.79.189.118:8091,
#                                  wildcard *.safehomelan.com cert, websockets)
#   The name resolves to 100.122.246.45 (casaos/NPM) via the Pi-hole local DNS
#   record; http://<node>:8091 also works on the tailnet.
#
# First run: BOOTSTRAP_USER_* creates the account below on first boot
# (only applied when the users table is still empty).
services:
  app:
    image: zot.safehomelan.com/metamcp:${IMAGE_TAG:-build-111}
    environment:
      NODE_ENV: "production"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "metamcp_user"
      POSTGRES_PASSWORD: "<redacted>"
      POSTGRES_DB: "metamcp_db"
      DATABASE_URL: "postgresql://metamcp_user:<redacted>@postgres:5432/metamcp_db"
      APP_URL: "https://mcp.safehomelan.com"
      NEXT_PUBLIC_APP_URL: "https://mcp.safehomelan.com"
      BETTER_AUTH_SECRET: "142b6589ca88e57468b965b047501ed923aeae4973d821bcd48d0666f55dfed7"
      # don't rewrite localhost: we point at tailnet addresses, not host.docker.internal
      TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL: "false"
      # bootstrap the admin account on first boot
      BOOTSTRAP_USER_EMAIL: "david@davidfield.co.uk"
      BOOTSTRAP_USER_PASSWORD: "<redacted>"
      BOOTSTRAP_USER_NAME: "david"
      BOOTSTRAP_DISABLE_REGISTRATION_UI: "true"
      TZ: "Europe/London"
    volumes:
      - type: bind
        source: /opt/docker/data/metamcp/npm
        target: /root/.npm
      - type: bind
        source: /opt/docker/data/metamcp/uv
        target: /root/.cache/uv
    ports:
      - "8091:12008"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:12008/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        order: stop-first

  postgres:
    image: zot.safehomelan.com/postgres16:16-alpine
    environment:
      POSTGRES_USER: "metamcp_user"
      POSTGRES_PASSWORD: "<redacted>"
      POSTGRES_DB: "metamcp_db"
      PGDATA: "/var/lib/postgresql/data/pgdata"
      TZ: "Europe/London"
    volumes:
      - type: bind
        source: /opt/docker/data/metamcp/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metamcp_user -d metamcp_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: stop-first
