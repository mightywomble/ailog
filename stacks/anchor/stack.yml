# anchor - rendered from wizard.yaml by homelab-wizard.
# Owned by the wizard: image tag, published ports, replicas, volumes.
# Everything else here is hand-maintained and survives a re-render.
services:
  anchor:
    image: zot.safehomelan.com/anchor:latest
    volumes:
    - type: bind
      source: /opt/docker/data/anchor
      target: /data
    ports:
    - 3001:3000
    deploy:
      replicas: 1
      restart_policy:
        condition: any
