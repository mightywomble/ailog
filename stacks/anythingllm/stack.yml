# anythingllm - rendered from wizard.yaml by homelab-wizard.
# Owned by the wizard: image tag, published ports, replicas, volumes.
# Everything else here is hand-maintained and survives a re-render.
services:
  anythingllm:
    image: zot.safehomelan.com/anythingllm:1.19.0
    environment:
      STORAGE_DIR: /app/server/storage
      TZ: Europe/London
    cap_add:
    - SYS_ADMIN
    volumes:
    - type: bind
      source: /opt/docker/data/anythingllm/storage
      target: /app/server/storage
    - type: bind
      source: /opt/docker/data/anythingllm/storage/.env
      target: /app/server/.env
    ports:
    - 3005:3001
    deploy:
      replicas: 1
      restart_policy:
        condition: any
