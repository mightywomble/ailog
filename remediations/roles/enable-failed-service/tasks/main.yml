- name: List failed units
  ansible.builtin.command: systemctl list-units --state=failed --no-legend --plain  # noqa: command-instead-of-module
  changed_when: false
  register: failed_units
- name: Enable and start them
  ansible.builtin.systemd:
    name: '{{ item }}'
    enabled: true
    state: started
  loop: '{{ failed_units.stdout_lines | map(''split'') | map(''first'') | list }}'
