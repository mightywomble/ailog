---
dependency:
  name: galaxy
driver:
  name: default
platforms:
  - name: instance
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    privileged: true
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    pre_build_image: true
provisioner:
  name: ansible
verifier:
  name: ansible
